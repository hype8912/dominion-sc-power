name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: "actions/checkout@v6"

      - name: Lint
        uses: "astral-sh/ruff-action@v3"

      - name: Format
        uses: "astral-sh/ruff-action@v3"
        with:
          args: "format --check"
